# Put the battery-powered right half into deep sleep after 15 minutes.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# nice!view status screen fed by the dongle (zmk-split-display-view),
# replacing the stock peripheral screen. Modifier order is mirrored so it
# reads outward-in like the left half.
CONFIG_ZMK_DISPLAY=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_ZMK_SPLIT_DISPLAY_VIEW=y
CONFIG_ZMK_SPLIT_DISPLAY_VIEW_MIRROR_MODIFIERS=y
